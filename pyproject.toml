[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsh-metrics"
version = "0.1.0"
description = "Offline trajectory analyzer and metrics report for DSH and Claude Code"
requires-python = ">=3.12"
dependencies = [
    "zstandard",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
dsh-metrics = "dsh_metrics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
